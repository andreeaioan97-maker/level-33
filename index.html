<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LEVEL 33</title>
<style>
  :root{--g:#39ff7a;--d:#0b1a10;--a:#ffd23f;--r:#ff4d6d}
  html,body{margin:0;height:100%;background:#000;color:var(--g);font-family:"Menlo","Courier New",monospace;overflow:hidden}
  #cab{position:relative;height:100%;max-width:760px;margin:auto;background:#050c07;overflow:hidden;display:flex;flex-direction:column;
       box-shadow:0 0 60px rgba(57,255,122,.25) inset}
  #cab::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
       background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  #hud{display:flex;justify-content:space-between;padding:8px 12px;font-size:14px;border-bottom:2px solid var(--g);letter-spacing:1px;text-shadow:0 0 6px var(--g)}
  #hud b{color:var(--a)}
  #bar{height:8px;background:#12301c}#fill{height:100%;width:100%;background:var(--g);transition:width .1s linear}
  #term{flex:1;padding:12px 14px;overflow:hidden;font-size:clamp(14px,2.6vw,19px);line-height:1.5;text-shadow:0 0 5px rgba(57,255,122,.6);position:relative}
  .dim{color:#9bbfa8} .cmt{color:#5f8d70}
  #code{white-space:pre;margin-top:10px;padding:10px;border-left:3px solid var(--g);background:rgba(57,255,122,.05)}
  #code .ok{color:var(--g)} #code .todo{color:#3d5f49} #code .cur{background:var(--g);color:#000;animation:bl .6s steps(1) infinite} #code .bad{background:var(--r);color:#fff}
  @keyframes bl{50%{background:transparent;color:var(--g)}}
  #log{margin-top:10px;color:#9bbfa8;font-size:.85em;min-height:4.2em}
  #combo{position:absolute;right:14px;top:10px;color:var(--a);font-size:28px;text-shadow:0 0 8px var(--a)}
  .screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:rgba(3,10,5,.88)}
  .hidden{display:none!important}
  h1{margin:0;font-size:clamp(40px,11vw,76px);letter-spacing:4px;color:var(--g);text-shadow:0 0 18px var(--g),4px 4px 0 #0a5a25}
  h2{margin:0;color:var(--a);text-shadow:0 0 10px var(--a)}
  p{margin:0;max-width:440px;line-height:1.5}
  .blink{animation:bl2 1s steps(1) infinite;color:var(--a);font-size:22px;cursor:pointer;border:0;background:none;font-family:inherit}
  @keyframes bl2{50%{opacity:0}}
  button.b{font:inherit;font-size:18px;color:#000;background:var(--g);border:0;padding:10px 24px;cursor:pointer;box-shadow:4px 4px 0 #0a5a25}
  pre#ascii,pre#cake{margin:0;text-align:left;font-size:clamp(12px,2.4vw,16px);line-height:1.3;color:var(--g);text-shadow:0 0 6px var(--g)}pre#cake{color:var(--a);text-shadow:0 0 8px var(--a)}
  #hid{position:absolute;opacity:0;left:0;top:0;width:1px;height:1px}
  .shake{animation:sh .25s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .flashr{animation:fr .3s}
  @keyframes fr{0%{box-shadow:0 0 0 999px rgba(255,77,109,.35) inset}}
</style>
</head>
<body>
<div id="cab">
  <div id="hud"><span>SCORE <b id="sc">0</b></span><span>LEVEL <b id="lv">1</b>/7</span><span>HI <b id="hi">0</b></span><span id="lives">♥♥♥</span></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="term">
    <div class="dim">$ codex "<span id="task"></span>"</div>
    <div id="combo"></div>
    <div id="code"></div>
    <div id="log"></div>
  </div>

  <div id="title" class="screen">
    <h1>LEVEL 33</h1>
    <p class="dim">An arcade for one coder.<br>Codex only writes what you type.<br>Type the code before time runs out.</p>
    <p class="cmt">Use your keyboard (phone: tap the screen to open it).<br>[M] music on/off</p>
    <button class="blink" id="start">&gt; PRESS START &lt;</button>
    <p class="cmt">© 2026 · 1 CREDIT</p>
  </div>

  <div id="cut" class="screen hidden">
    <h2 id="cutT"></h2>
    <pre id="ascii"></pre>
    <p id="cutL" class="dim"></p>
    <button class="b" id="next">CONTINUE</button>
  </div>

  <div id="over" class="screen hidden">
    <h2 id="overT"></h2>
    <pre id="cake" class="hidden"></pre>
    <p id="overL"></p>
    <button class="b" id="again">INSERT COIN (RETRY)</button>
  </div>

  <input id="hid" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
</div>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
"use strict";
const $ = id => document.getElementById(id);
// Each level: a different kind of code. Indentation is typed for you after Enter.
const LEVELS = [
  { name: "javascript · loop", task: "warm up. count to three.", time: 40,
    code: "for (let i = 1; i <= 3; i++) {\n  console.log(\"ready \" + i);\n}",
    out: "ready 1 · ready 2 · ready 3" },
  { name: "shell · git", task: "deploy to prod. it is friday 17:59.", time: 40,
    code: "git add .\ngit commit -m \"small fix\"\ngit push --force",
    out: "pushed. 412 files changed. have a nice weekend." },
  { name: "python · recursion", task: "countdown, but make it recursive", time: 40,
    code: "def countdown(n):\n  if n == 0:\n    return \"liftoff\"\n  return countdown(n - 1)",
    out: "countdown(10) -> \"liftoff\" 🚀" },
  { name: "sql · query", task: "find every open bug", time: 45,
    code: "SELECT * FROM bugs\nWHERE status = 'open'\nORDER BY severity DESC;",
    out: "0 rows returned. suspicious." },
  { name: "bash · pipes", task: "how many todos are urgent?", time: 45,
    code: "cat todo.txt | grep -i urgent | wc -l",
    out: "33" },
  { name: "python · recursion", task: "flatten a list of lists of lists", time: 55,
    code: "def flat(x):\n  if not isinstance(x, list):\n    return [x]\n  out = []\n  for i in x:\n    out += flat(i)\n  return out",
    out: "[[1, [2, [3]]]] -> [1, 2, 3]" },
  { name: "BOSS · level()", task: "the final function. it calls itself.", time: 55,
    code: "def level(n):\n  if n == 33:\n    return \"HAPPY BIRTHDAY\"\n  return level(n + 1)\n\nprint(level(1))",
    out: "level(1) -> 33 calls deep" },
];
const QUIPS = ["Codex: “I couldn't have typed it better.”", "Codex: “Ship it.”", "Codex: “LGTM 👍”", "Codex: “Zero warnings. Who are you?”",
  "Codex: “Tests pass. Nobody knows why.”", "Codex: “Stack overflow avoided.”"];

let typos, lvlStart, lvl, code, pos, score, lives, combo, hi = +localStorage.getItem("l33hi") || 0, tLeft, timer, state = "title", total0, wrong;
$("hi").textContent = hi;

const bgm = $("bgm"); bgm.volume = .55; let muted = false;
function music() { if (!muted) bgm.play().catch(() => {}); }

// ---- tiny sfx -----------------------------------------------------------
let ac; function beep(f, d = .06, type = "square", v = .05) {
  if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + d);
}

// ---- rendering ----------------------------------------------------------
function esc(c) { return c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c; }
function render() {
  let h = "";
  for (let i = 0; i < code.length; i++) {
    const c = esc(code[i]) , ch = code[i] === "\n" ? "↵\n" : c;
    if (i < pos) h += `<span class="ok">${code[i] === "\n" ? "\n" : c}</span>`;
    else if (i === pos) h += `<span class="${wrong ? "bad" : "cur"}">${code[i] === "\n" ? "↵" : c === " " ? "&nbsp;" : c}</span>${code[i] === "\n" ? "\n" : ""}`;
    else h += `<span class="todo">${code[i] === "\n" ? "\n" : c}</span>`;
  }
  $("code").innerHTML = h;
  $("sc").textContent = score; $("lv").textContent = lvl + 1; $("lives").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
  $("combo").textContent = combo > 4 ? combo + " COMBO" : "";
}
function log(s) { $("log").innerHTML = s; }
function show(id) { ["title", "cut", "over"].forEach(x => $(x).classList.toggle("hidden", x !== id)); }

// ---- game flow ----------------------------------------------------------
function newGame() { lvl = 0; score = 0; lives = 3; combo = 0; loadLevel(); }
function loadLevel() {
  const L = LEVELS[lvl]; code = L.code; pos = 0; typos = 0; lvlStart = Date.now(); wrong = false; tLeft = L.time; total0 = L.time;
  $("task").textContent = L.task; log("<span class='cmt'># " + L.name + " — type the code. Enter = new line.</span>");
  show(null); state = "play"; skipIndent(); render(); focusInput();
  clearInterval(timer); timer = setInterval(tick, 100);
}
function skipIndent() { if (code[pos - 1] === "\n") while (code[pos] === " ") pos++; }
function tick() {
  if (state !== "play") return;
  tLeft -= .1; $("fill").style.width = Math.max(0, tLeft / total0 * 100) + "%";
  $("fill").style.background = tLeft < 8 ? "var(--r)" : "var(--g)";
  if (tLeft <= 0) loseLife("TIME OUT");
}
function loseLife(why) {
  lives--; combo = 0; beep(120, .4, "sawtooth", .08); $("term").classList.remove("flashr"); void $("term").offsetWidth; $("term").classList.add("flashr");
  if (lives <= 0) return gameOver();
  pos = 0; wrong = false; tLeft = LEVELS[lvl].time; skipIndent(); log(`<span style="color:var(--r)">${why}. Codex discarded the draft. Lives left: ${lives}</span>`); render();
}
function type(ch) {
  if (state !== "play") return;
  const want = code[pos];
  if (ch === want) {
    wrong = false; pos++; combo++; score += 10 + Math.min(combo, 30); beep(600 + Math.min(combo, 20) * 20, .04);
    if (want === "\n") skipIndent();
    if (pos >= code.length) return levelDone();
  } else {
    wrong = true; typos++; combo = 0; score = Math.max(0, score - 5); beep(150, .1, "sawtooth");
    $("code").classList.remove("shake"); void $("code").offsetWidth; $("code").classList.add("shake");
  }
  render();
}
function levelDone() {
  clearInterval(timer); state = "cut"; const bonus = Math.round(tLeft * 20); score += bonus + 200; beep(880, .15); setTimeout(() => beep(1175, .25), 150);
  const L = LEVELS[lvl]; render();
  log(`<span class="ok">✔ ${L.out}</span> &nbsp; time bonus +${bonus}`);
  if (lvl === LEVELS.length - 1) return setTimeout(win, 900);
  setTimeout(() => {
    $("cutT").textContent = `LEVEL ${lvl + 1} CLEAR`;
    const n = code.replace(/\n +/g, "\n").length, secs = (Date.now() - lvlStart) / 1000, acc = Math.round(n / (n + typos) * 100);
    const wpm = Math.round(n / 5 / (secs / 60)), rank = acc === 100 ? "S" : acc >= 95 ? "A" : acc >= 85 ? "B" : "C";
    const row = (k, v) => "│ " + (k + " ").padEnd(13, ".") + " " + String(v).padStart(8) + " │";
    $("ascii").textContent = ["┌─────────────────────────┐", row("SPEED", wpm + " wpm"), row("ACCURACY", acc + "%"), row("TYPOS", typos),
      row("TIME BONUS", "+" + bonus), "├─────────────────────────┤", row("RANK", rank), "└─────────────────────────┘"].join("\n");
    $("cutL").textContent = QUIPS[lvl % QUIPS.length];
    $("next").textContent = lvl === LEVELS.length - 2 ? "FACE THE BOSS" : "CONTINUE"; show("cut");
  }, 900);
}
function gameOver() {
  clearInterval(timer); state = "over"; saveHi();
  $("cake").classList.add("hidden"); $("overT").textContent = "GAME OVER"; $("overL").innerHTML = `RecursionError: maximum lives exceeded.<br>Score ${score}`; show("over");
}
function win() {
  state = "over"; saveHi();
  $("overT").textContent = "level(1) → HAPPY BIRTHDAY, ALEX!";
  $("overL").innerHTML = `33 calls deep and the stack unwound perfectly.<br>Final score ${score}.<br><br>Level 33 unlocked. New high score for life.`;
  $("cake").textContent = "      i  i  i\n    _|__|__|_\n   |  ~ 33 ~  |\n  _|__________|_\n |  HAPPY  B-DAY |\n |________________|"; $("cake").classList.remove("hidden"); show("over"); [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, .3, "square", .06), i * 160));
}
function saveHi() { if (score > hi) { hi = score; localStorage.setItem("l33hi", hi); $("hi").textContent = hi; } }

// ---- input --------------------------------------------------------------
const hid = $("hid"); function focusInput() { hid.focus({ preventScroll: true }); }
hid.addEventListener("input", () => { const v = hid.value; hid.value = ""; for (const c of v) type(c); });
addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "m" && state !== "play") { muted = !muted; muted ? bgm.pause() : music(); return; }
  if (state === "title" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("start").click(); return; }
  if (state === "cut" && e.key === "Enter") { $("next").click(); return; }
  if (state === "over" && e.key === "Enter") { $("again").click(); return; }
  if (state !== "play") return;
  if (e.key === "Enter") { e.preventDefault(); type("\n"); }
  else if (e.key === "Tab") { e.preventDefault(); }
  else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); type(e.key); }
});
addEventListener("pointerdown", () => { if (state === "play") focusInput(); });
$("start").onclick = () => { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); music(); newGame(); };
$("next").onclick = () => { lvl++; loadLevel(); };
$("again").onclick = () => { music(); newGame(); };

// ---- demo / attract mode: open with ?demo to watch the game play itself -----
if (new URLSearchParams(location.search).has("demo")) {
  $("start").textContent = "> PRESS START (DEMO) <";
  let cutSince = 0;
  (function bot() {
    let wait = 70 + Math.random() * 90;
    if (state === "play") {
      if (code[pos] === "\n") wait += 220;                       // pause at line ends, like a human
      if (!wrong && Math.random() < .035) type("qxz;"[Math.random() * 4 | 0]);   // occasional typo
      else type(code[pos]);
    } else if (state === "cut" && !$("cut").classList.contains("hidden")) {
      if (!cutSince) cutSince = Date.now();
      if (Date.now() - cutSince > 3500) { cutSince = 0; $("next").click(); }
    }
    setTimeout(bot, wait);
  })();
}
</script>
</body>
</html>
